name: quality-inspection-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qit
      POSTGRES_PASSWORD: qit
      POSTGRES_DB: qit
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qit -d qit"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://qit:qit@db:5432/qit
      SEED_DEMO_DATA: "true"
      SAP_WEBHOOK_SECRET: ${SAP_WEBHOOK_SECRET:-dev-sap-secret}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
